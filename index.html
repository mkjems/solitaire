<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07301c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Solitaire" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Title, description, translations, link previews and structured data:
         filled in per language from site/pages.ts by site/plugin.ts. -->
    <!-- page:head -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The player's felt, laid before anything is drawn (see src/ui/theme.ts). -->
    <script>
      try {
        const felt = JSON.parse(localStorage.getItem('solitaire.settings') || '{}').felt;
        if (typeof felt === 'string') document.documentElement.dataset.felt = felt;
      } catch {}
    </script>
    <!-- Cookie-free visit counting, shared with the other mkjems.dk sites. -->
    <script>window.goatcounter = { path: (p) => location.host + p };</script>
    <script data-goatcounter="https://stats.mkjems.dk/count" async src="//stats.mkjems.dk/count.js"></script>
  </head>
  <body>
    <main id="table" class="table" data-phase="loading"></main>
    <div id="hud-root"></div>
    <div id="safe-area-probe" aria-hidden="true"></div>

    <!-- What the game is, as plain text for search engines and screen readers
         (filled in per language). The table covers the whole screen, so this is
         not drawn on it. -->
    <!-- page:about -->

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
