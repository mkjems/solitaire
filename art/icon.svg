<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="felt" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#23895a"/>
      <stop offset="0.55" stop-color="#14603a"/>
      <stop offset="1" stop-color="#073019"/>
    </radialGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3670"/>
      <stop offset="1" stop-color="#0a1634"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e09a"/>
      <stop offset="0.5" stop-color="#cfa850"/>
      <stop offset="1" stop-color="#94702a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#felt)"/>

  <!-- Card back, tilted left -->
  <g transform="translate(212 262) rotate(-13)" filter="url(#shadow)">
