    <rect x="-80" y="-112" width="160" height="224" rx="13" fill="#fffdf7" stroke="#cfc6b2" stroke-width="1.5"/>
    <text x="-60" y="-64" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#17171b">A</text>
    <path transform="translate(0 14) scale(0.1)" d="M0 -500C100 -250 355 -100 355 185A150 150 0 0 1 55 185A10 10 0 0 0 35 185C35 385 85 400 130 500L-130 500C-85 400 -35 385 -35 185A10 10 0 0 0 -55 185A150 150 0 0 1 -355 185C-355 -100 -100 -250 0 -500Z" fill="#17171b"/>
