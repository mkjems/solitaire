    <rect x="-72" y="-104" width="144" height="208" rx="8" fill="url(#navy)"/>
    <rect x="-65" y="-97" width="130" height="194" rx="5" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M0 -40L28 0L0 40L-28 0Z" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M0 -20C2 -6 5 -2 13 0C5 2 2 6 0 20C-2 6 -5 2 -13 0C-5 -2 -2 -6 0 -20Z" fill="url(#gold)"/>
  </g>

  <!-- Ace of spades, tilted right -->
