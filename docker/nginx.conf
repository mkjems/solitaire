server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /healthz {
        access_log off;
        return 204;
    }

    # Built scripts and styles have a content hash in their names, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # nginx does not know this extension; browsers want the right type to install the game.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Everything else (the page, the service worker, card art, icons) keeps its name
    # between releases, so browsers check for a newer copy each time.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
