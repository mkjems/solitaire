  <rect x="-103" y="-151" width="206" height="302" rx="4" fill="none" stroke="url(#gold)" stroke-width="2.2"/>
  <rect x="-97.5" y="-145.5" width="195" height="291" rx="2" fill="none" stroke="url(#gold)" stroke-width="0.8"/>

  <!-- Centre medallion; symmetric so the back reads the same both ways up -->
