<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -168 240 336" preserveAspectRatio="none">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3670"/>
      <stop offset="0.5" stop-color="#11234e"/>
      <stop offset="1" stop-color="#0a1634"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e09a"/>
      <stop offset="0.5" stop-color="#cfa850"/>
      <stop offset="1" stop-color="#94702a"/>
    </linearGradient>
    <pattern id="lattice" width="18" height="18" x="-9" y="-9" patternUnits="userSpaceOnUse">
