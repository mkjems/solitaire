  <path d="M0 -40L28 0L0 40L-28 0Z" fill="none" stroke="url(#gold)" stroke-width="0.8"/>
  <path d="M0 -24C2 -7 6 -2 15 0C6 2 2 7 0 24C-2 7 -6 2 -15 0C-6 -2 -2 -7 0 -24Z" fill="url(#gold)"/>

